name = "northstar-equity-api"
main = "worker/index.js"
compatibility_date = "2026-11-12"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"

[[d1_databases]]
binding = "DB"
database_name = "northstar-equity"
# Local-only placeholder UUID. Replace with the real ID only after creating a Cloudflare D1 database.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
