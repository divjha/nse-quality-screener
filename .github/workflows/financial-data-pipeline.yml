name: Financial data pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - "data/inbox/financial_facts.csv"
      - "scripts/build_dataset.py"
      - "scripts/build-d1-seed.mjs"
      - "worker/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/financial-data-pipeline.yml"
  schedule:
    - cron: "25 3 * * 1"

permissions:
  contents: write

concurrency:
  group: financial-data-pipeline
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate and build financial dataset
        run: python scripts/build_dataset.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check API and D1 seed generator syntax
        run: |
          node --check worker/index.js
          node --check scripts/build-d1-seed.mjs
          node --check tests/worker.test.mjs
      - name: Run Worker API tests
        run: npm run test:api
      - name: Validate dataset-to-D1 import generation
        run: |
          node scripts/build-d1-seed.mjs
          test -s data/generated/d1_seed.sql
          grep -q "INSERT OR IGNORE INTO financial_facts" data/generated/d1_seed.sql
          rm data/generated/d1_seed.sql
      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/financial_facts.json data/generated/data_quality_report.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Build validated financial facts dataset"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}"
              if git push; then
                pushed=true
                break
              fi
              echo "Push attempt ${attempt} failed; retrying after refreshing remote."
              sleep 2
            done
            if [ "${pushed}" != "true" ]; then
              echo "Could not publish generated data after five attempts."
              exit 1
            fi
          fi
